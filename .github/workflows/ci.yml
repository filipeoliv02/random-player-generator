name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test
        run: mvn -B -ntp verify

      - name: Smoke test the jar
        run: java -jar target/random-player-generator.jar --count 2 --seed 42

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: random-player-generator
          path: target/random-player-generator.jar
          if-no-files-found: error
